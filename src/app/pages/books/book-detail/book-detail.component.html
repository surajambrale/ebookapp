<div class="book-detail" *ngIf="book">

  <div class="top-section">

    <div class="image">
      <img [src]="book.image || book.coverImage">
    </div>

    <div class="details">
      <h1>{{ book.title }}</h1>
      <p class="author">{{ book.author }}</p>

      <div class="rating">
        ⭐⭐⭐⭐☆ ({{ book.reviews }})
      </div>

      <h2 class="price">₹{{ book.price }}</h2>

      <!-- 🔥 BUTTONS -->
      <div class="actions">

        <button class="buy" *ngIf="hasAccess" (click)="readBook()">
          Read Book
        </button>

        <!-- =========================
COUPON SECTION
========================= -->

        <div class="coupon-box" *ngIf="!hasAccess">

          <h3>🎟 Apply Coupon</h3>

          <div style="display:flex;gap:10px;">

            <input type="text" placeholder="Enter Coupon Code" [(ngModel)]="couponCode" style="flex:1;">

            <button (click)="applyCoupon()">

              Apply

            </button>

          </div>

          <div *ngIf="couponApplied" style="margin-top:15px;">

            <p>

              <b>Original Price :</b>

              ₹{{book.price}}

            </p>

            <p style="color:green;">

              <b>Discount :</b>

              - ₹{{discount}}

            </p>

            <p style="font-size:20px;font-weight:bold;">

              Final Price :

              ₹{{finalPrice}}

            </p>

          </div>

        </div>

        <button
  class="premium-buy-btn"
  (click)="buyBook()"
  [disabled]="isLoading">

  <span *ngIf="!isLoading">
    🛒 Buy Now
  </span>

  <span *ngIf="isLoading" class="btn-loader"></span>

</button>

      </div>

      <!-- book preview code start -->

      <!-- 🔥 BOOK PREVIEW -->
      <div class="preview-section" *ngIf="book.previewImages?.length">

        <h3>Preview Pages</h3>

        <div class="slider">
          <button class="nav-btn left" (click)="prevImage()">‹</button>

          <div class="image-frame">
            <img [src]="book.previewImages[currentImageIndex]" class="preview-img" (touchstart)="onTouchStart($event)"
              (touchend)="onTouchEnd($event)" />
          </div>

          <button class="nav-btn right" (click)="nextImage()">›</button>
        </div>

        <div class="dots">
          <span *ngFor="let img of book.previewImages; let i = index" [class.active]="i === currentImageIndex"
            (click)="goToImage(i)">
          </span>
        </div>

      </div>

      <!-- book preview code end -->

      <!-- 🔥 MOVE DESCRIPTION HERE -->
      <div class="description">
        <h3>Book Overview</h3>
        <p>{{ book.description }}</p>
      </div>

    </div>

  </div>

</div>

<!-- WhatsApp Floating Button start -->
<a href="https://wa.me/919372336433?text=Hello%20I%20am%20interested%20in%20your%20ebooks" class="whatsapp-float"
  target="_blank">
  <img src="assets/images/whatsapp.png" alt="WhatsApp" />
</a>

<!-- WhatsApp Floating Button end -->

  <div class="nav-item" routerLink="/profile" routerLinkActive="active">
