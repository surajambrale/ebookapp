<div class="profile-page">

  <!-- 🔥 TITLE -->

  <h1>👤 My Profile</h1>

  <!-- 🔥 ROLE SELECT -->

  <div class="role-box">

    <label>
      Select Account Type
    </label>

    <select [(ngModel)]="selectedRole">

      <option value="user">
        User
      </option>

      <option value="admin">
        Admin
      </option>

    </select>

  </div>

  <!-- 🔥 USER SECTION -->

  <div *ngIf="selectedRole === 'user'">

    <!-- 🔥 LOGIN BOX -->

    <div
      class="login-box"
      *ngIf="!isLoggedIn"
    >

      <h3>
        Login to Continue
      </h3>

      <button
        class="login-btn"
        (click)="goLogin()"
      >
        Login
      </button>

    </div>

    <!-- 🔥 PROFILE -->

    <div *ngIf="isLoggedIn">

      <div class="profile-card">

        <div class="profile-top">

          <div class="profile-image">
            👤
          </div>

          <div class="profile-info">

            <h2>
              {{ user?.name }}
            </h2>

            <p>
              {{ user?.phone }}
            </p>

          </div>

        </div>

      </div>

      <!-- 🔥 MENU -->

      <div class="menu-card">

        <div
          class="menu-item"
          routerLink="/my-books"
        >

          <span>📚</span>

          <p>My Books</p>

        </div>

        <div class="menu-item">

          <span>💳</span>

          <p>Payments</p>

        </div>

        <div class="menu-item">

          <span>📞</span>

          <p>Support: 9372336433</p>

        </div>

      </div>

      <!-- 🔥 LOGOUT -->

      <button
        class="logout-btn"
        (click)="logout()"
      >
        Logout
      </button>

    </div>

  </div>

  <!-- 🔥 ADMIN SECTION -->

  <div *ngIf="selectedRole === 'admin'">

    <div class="admin-login">

      <input
        type="password"
        placeholder="Enter Admin Password"
        [(ngModel)]="adminPassword"
      />

      <button (click)="adminLogin()">
        Login Admin
      </button>

    </div>

  </div>

</div>




<!-- navbar start start -->
<!-- 🔥 BOTTOM NAVBAR -->

<div class="bottom-navbar">

  <!-- HOME -->
  <div
    class="nav-item"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <span>🏠</span>
    <p>Home</p>
  </div>

  <!-- EXPLORE -->
  <div
    class="nav-item"
    routerLink="/explore"
    routerLinkActive="active"
  >
    <span>🔍</span>
    <p>Explore</p>
  </div>

  <!-- MY BOOKS -->
  <div
    class="nav-item"
    routerLink="/my-books"
    routerLinkActive="active"
  >
    <span>📚</span>
    <p>My Books</p>
  </div>

  <!-- PROFILE -->
  <div
    class="nav-item"
    routerLink="/profile"
    routerLinkActive="active"
  >
    <span>👤</span>
    <p>Profile</p>
  </div>

</div>

<!-- navbar end -->
