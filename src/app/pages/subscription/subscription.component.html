<div class="subscription-container">

    <h1>Unlimited Ebook Membership</h1>

    <p class="price">

        ₹1 <span>/ Month</span>

    </p>

    <ul>

        <li>✅ Unlimited Books</li>

        <li>✅ New Books Every Month</li>

        <li>✅ Read Anytime</li>

        <li>✅ Mobile Friendly</li>

        <li>✅ Cancel Anytime</li>

    </ul>

    <button
        class="subscribe-btn"
        (click)="subscribe()">

        Subscribe Now

    </button>

</div>
